name: NordStatus
version: '1.2.0'
main: com.nordfjell.nordstatus.NordStatusPlugin
api-version: '26.2'
author: Nord Fjell
description: Sends a Paper health heartbeat to Instatus.

commands:
  nordstatus:
    description: Reload NordStatus configuration or send a test heartbeat.
    usage: /nordstatus <reload|test>
    permission: nordstatus.admin

permissions:
  nordstatus.admin:
    default: op
